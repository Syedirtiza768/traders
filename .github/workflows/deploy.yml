name: CD — Deploy

on:
  workflow_run:
    workflows: ["CI — Build & Test"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/trader

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Deploy to Target Environment
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}

    environment:
      name: ${{ github.event.inputs.environment || 'staging' }}
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure pinned deploy host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          test -n "$DEPLOY_KNOWN_HOSTS" || (echo "DEPLOY_KNOWN_HOSTS is required" >&2; exit 1)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/traders' }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          remote_env=$(printf 'DEPLOY_PATH=%q TARGET_SHA=%q' "$DEPLOY_PATH" "$TARGET_SHA")
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "$remote_env bash -se" << 'DEPLOY_SCRIPT'
            set -euo pipefail

            cd "$DEPLOY_PATH"
            git fetch --no-tags origin "$TARGET_SHA"
            git checkout --detach "$TARGET_SHA"
            cd compose
            set -a
            source .env
            set +a
            : "${SITE_NAME:?SITE_NAME must be set in compose/.env}"

            echo "Creating mandatory pre-deploy backup..."
            bash ../scripts/backup.sh

            compose_files=(-f docker-compose.yml -f docker-compose.prod.yml)
            docker compose "${compose_files[@]}" build
            docker compose "${compose_files[@]}" up -d --remove-orphans
            docker compose "${compose_files[@]}" exec -T backend bench --site "$SITE_NAME" migrate
            docker compose "${compose_files[@]}" exec -T backend bench --site "$SITE_NAME" clear-cache
            docker compose "${compose_files[@]}" ps
          DEPLOY_SCRIPT

      - name: Health Check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          echo "Running health check against $DEPLOY_URL ..."
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" "${DEPLOY_URL}/api/method/ping" 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "  Attempt $i: HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "⚠️ Health check did not return 200 — please verify manually."
          exit 1

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const env = '${{ github.event.inputs.environment || "staging" }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment failed: ${env}`,
              body: `Deployment to **${env}** failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['deployment', 'bug'],
            });
