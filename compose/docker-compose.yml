# ============================================
# Traders — Docker Compose
# Complete trader business system on ERPNext
# ============================================

x-backend-defaults: &backend-defaults
  image: traders-backend:latest
  build:
    context: ..
    dockerfile: infra/docker/backend.Dockerfile
    args:
      # Use a released Bench image rather than the mutable latest tag.
      BENCH_VERSION: ${BENCH_VERSION:-v5.31.0}
      # Pin frappe/erpnext so rebuilds are reproducible and don't drift to
      # version-15 branch head (which would trigger unexpected core migrations).
      FRAPPE_VERSION: ${FRAPPE_VERSION:-v15.113.1}
      ERPNEXT_VERSION: ${ERPNEXT_VERSION:-v15.114.0}
  restart: unless-stopped
  env_file:
    - .env
  volumes:
    - sites-vol:/home/frappe/frappe-bench/sites
    - logs-vol:/home/frappe/frappe-bench/logs
  depends_on:
    db:
      condition: service_healthy
    redis-cache:
      condition: service_healthy
    redis-queue:
      condition: service_healthy

services:
  # ===========================================
  # DATABASE
  # ===========================================
  db:
    image: mariadb:10.11.19@sha256:7f22313fc130a377a44999965bcb0a08dd5b21e8502824c1b864f792f9bc66ab
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=512M
      - --innodb-log-file-size=64M
      - --max-allowed-packet=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes:
      - db-vol:/var/lib/mysql
    # No host port binding — DB is only accessed by backend containers on
    # the internal Docker network.  Removes collision with any host MariaDB.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================
  # REDIS — CACHE
  # ===========================================
  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-vol:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ===========================================
  # REDIS — QUEUE
  # ===========================================
  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb
    volumes:
      - redis-queue-vol:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Create the Frappe site and install ERPNext + Trader App once the durable
  # database and Redis services are ready. The named sites volume makes this
  # idempotent across ordinary restarts and image updates.
  site-init:
    <<: *backend-defaults
    restart: "no"
    command: ["/usr/local/bin/traders-init-site"]

  # ===========================================
  # FRAPPE BACKEND
  # ===========================================
  backend:
    <<: *backend-defaults
    expose:
      - "8000"
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        export SITES_PATH=sites &&
        mkdir -p /home/frappe/logs &&
        ln -sfn /home/frappe/frappe-bench/logs /home/frappe/logs &&
        for site_dir in sites/*/; do
          site=$$(basename $$site_dir);
          mkdir -p sites/$$site/logs;
          mkdir -p /home/frappe/frappe-bench/$$site;
          ln -sfn /home/frappe/frappe-bench/sites/$$site/logs /home/frappe/frappe-bench/$$site/logs 2>/dev/null || true;
        done &&
        bench set-config -g db_host $${DB_HOST} &&
        bench set-config -g redis_cache redis://$${REDIS_CACHE} &&
        bench set-config -g redis_queue redis://$${REDIS_QUEUE} &&
        /home/frappe/frappe-bench/env/bin/gunicorn --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-4} --threads $${GUNICORN_THREADS:-4} --worker-class gthread --timeout 120 --graceful-timeout 30 --log-level info frappe.app:application
      "
    # Keep this independent of SITE_NAME. The deployment script may need to
    # create/repair the site after Gunicorn is already accepting connections.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/home/frappe/frappe-bench/env/bin/python -c \"import socket; s = socket.create_connection(('127.0.0.1', 8000), 5); s.close()\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 180s

  # ===========================================
  # WEBSOCKET
  # ===========================================
  websocket:
    <<: *backend-defaults
    expose:
      - "9000"
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        node apps/frappe/socketio.js
      "
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const net=require('node:net');const s=net.createConnection({host:'127.0.0.1',port:9000});s.setTimeout(5000);s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.on('timeout',()=>{s.destroy();process.exit(1)})",
        ]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 30s

  # ===========================================
  # WORKERS
  # ===========================================
  worker-short:
    <<: *backend-defaults
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        bench worker --queue short
      "

  worker-long:
    <<: *backend-defaults
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        bench worker --queue long
      "

  worker-default:
    <<: *backend-defaults
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        bench worker --queue default
      "

  # ===========================================
  # SCHEDULER
  # ===========================================
  scheduler:
    <<: *backend-defaults
    depends_on:
      site-init:
        condition: service_completed_successfully
    command: >
      bash -c "
        cd /home/frappe/frappe-bench &&
        bench schedule
      "

  # ===========================================
  # CUSTOM FRONTEND
  # ===========================================
  frontend:
    image: traders-frontend:latest
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    restart: unless-stopped
    # No host port binding needed — only the proxy container needs to reach
    # frontend:3000 on the internal Docker network. Removing the host port
    # binding avoids collisions with any process already using port 3000 on
    # the EC2 host (e.g. a previous Node / nginx instance).
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===========================================
  # NGINX REVERSE PROXY
  # ===========================================
  proxy:
    image: nginx:1.30.5-alpine3.24
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../infra/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# ===========================================
# VOLUMES
# ===========================================
volumes:
  db-vol:
    driver: local
  redis-cache-vol:
    driver: local
  redis-queue-vol:
    driver: local
  sites-vol:
    driver: local
  logs-vol:
    driver: local
